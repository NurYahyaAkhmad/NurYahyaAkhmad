        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="15"
        font-weight="500"
        letter-spacing="3">
    INDONESIA
  </text>

  <!-- Divider -->
  <path d="M56 338 H1212" stroke="#a2b1c5" stroke-opacity="0.45" stroke-width="1"/>

  <!-- Backdrop papers / human-made collage -->
  <g opacity="0.75">
    <g transform="translate(745 62) rotate(-7)">
      <rect x="0" y="0" width="74" height="96" rx="4" fill="#b9b1a5" opacity="0.28"/>
      <rect x="8" y="10" width="58" height="64" rx="2" fill="#182231"/>
      <circle cx="49" cy="26" r="7" fill="#e8edf5" opacity="0.6"/>
      <path d="M8 57 L24 42 L34 51 L46 35 L66 57 V74 H8 Z" fill="#3c4a60"/>
      <path d="M8 63 L18 55 L30 58 L40 49 L56 63 V74 H8 Z" fill="#55647a"/>
    </g>

    <g transform="translate(1160 48) rotate(4)">
