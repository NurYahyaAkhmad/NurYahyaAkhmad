  </text>
  <circle cx="231" cy="320" r="2.4" fill="#d8dfeb" opacity="0.9"/>

  <text x="253" y="326"
        fill="#d8dfeb"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="17"
        font-weight="500"
        letter-spacing="3">
    GAME DEV
  </text>

  <text x="1212" y="326"
