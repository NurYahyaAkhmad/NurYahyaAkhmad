<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Hello there traveler!</title>
  <desc id="desc">A dark GitHub profile banner with a creative workspace illustration.</desc>

  <!-- Background -->
  <rect width="1280" height="360" rx="18" fill="#0d1117"/>

  <!-- Brand -->
  <rect x="54" y="42" width="12" height="12" fill="#f0f6fc"/>

  <text x="80" y="53"
        fill="#8b949e"
        font-family="Consolas, Monaco, monospace"
        font-size="17"
        font-weight="700"
        letter-spacing="3">
    YAHYAKUN
  </text>

  <!-- Main title -->
  <text x="52" y="145"
        fill="#f0f6fc"
        font-family="Trebuchet MS, Segoe UI, Arial, sans-serif"
        font-size="62"
        font-weight="700"
        letter-spacing="-2">
    Hello there traveler!
  </text>

  <!-- Subtitle -->
  <text x="55" y="195"
        fill="#8b949e"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="28">
    welcome to my github
  </text>

  <!-- Categories -->
  <text x="56" y="310"
        fill="#c9d1d9"
        font-family="Consolas, Monaco, monospace"
        font-size="17"
        letter-spacing="2">
    WEB
  </text>

  <circle cx="119" cy="304" r="2.5" fill="#f0f6fc"/>

  <text x="140" y="310"
        fill="#c9d1d9"
        font-family="Consolas, Monaco, monospace"
        font-size="17"
        letter-spacing="2">
    MEDIA
  </text>

  <circle cx="225" cy="304" r="2.5" fill="#f0f6fc"/>

  <text x="247" y="310"
        fill="#c9d1d9"
        font-family="Consolas, Monaco, monospace"
        font-size="17"
        letter-spacing="2">
    GAME DEV
  </text>

  <text x="706" y="310"
        fill="#8b949e"
        text-anchor="end"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="15">
    INDONESIA
  </text>

  <!-- Divider -->
  <path d="M56 326 H706"
        stroke="#30363d"
        stroke-width="1"/>

  <!-- Website illustration -->
  <g transform="translate(785 49)">

    <!-- Rounded outer frame only -->
    <rect x="29" y="0"
          width="384"
          height="254"
          rx="12"
          fill="#161b22"/>

    <!-- Windows controls -->
    <g>
      <!-- Minimize -->
      <path d="M344 19 H356"
            stroke="#8b949e"
            stroke-width="1.6"/>

      <!-- Maximize -->
      <rect x="371" y="13"
            width="11"
            height="11"
            fill="none"
            stroke="#8b949e"
            stroke-width="1.4"/>

      <!-- Close -->
      <path d="M397 13 L407 23 M407 13 L397 23"
            stroke="#f0f6fc"
            stroke-width="1.6"
            stroke-linecap="round"/>
    </g>

    <!-- Content area -->
    <rect x="50" y="56"
          width="214"
          height="128"
          fill="#0d1117"/>

    <!-- Grid -->
    <g fill="#21262d">
      <rect x="63" y="69" width="40" height="36"/>
      <rect x="110" y="69" width="40" height="36"/>
      <rect x="157" y="69" width="40" height="36"/>
      <rect x="204" y="69" width="40" height="36"/>

      <rect x="63" y="112" width="40" height="56"/>
      <rect x="110" y="112" width="40" height="56"/>
      <rect x="157" y="112" width="40" height="56"/>
      <rect x="204" y="112" width="40" height="56"/>
    </g>

    <!-- Active tile -->
    <rect x="157" y="69"
          width="40"
          height="36"
          fill="#f0f6fc"/>

    <path d="M177 78 V96 M168 87 H186"
          stroke="#0d1117"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- Video panel -->
    <rect x="281" y="56"
          width="112"
          height="128"
          fill="#21262d"/>

    <circle cx="337" cy="105"
            r="26"
            fill="#30363d"/>

    <path d="M332 94 L348 105 L332 116 Z"
          fill="#f0f6fc"/>

    <!-- Text blocks -->
    <rect x="50" y="204"
          width="150"
          height="7"
          fill="#8b949e"/>

    <rect x="50" y="220"
          width="95"
          height="5"
          fill="#484f58"/>

    <rect x="281" y="219"
          width="85"
          height="5"
          fill="#f0f6fc"/>

    <!-- Cursor -->
    <path d="M6 220 L40 228 L28 239 L41 261 L33 266 L20 245 L8 253 Z"
          fill="#f0f6fc"
          stroke="#0d1117"
          stroke-width="3"
          stroke-linejoin="round"/>
  </g>
</svg>
