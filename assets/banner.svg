<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Hi there Traveler!</title>
  <desc id="desc">A GitHub-inspired dark blue banner with a creative workspace illustration.</desc>

  <!-- Background -->
  <rect width="1280" height="360" rx="18" fill="#0d1117"/>

  <!-- Brand -->
  <path d="M54 42h12v12H54z" fill="#58a6ff"/>
  <text x="80" y="53"
        fill="#8b949e"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="17"
        letter-spacing="3">
    YAHYAKUN
  </text>

  <!-- Main title -->
  <text x="52" y="170"
        fill="#f0f6fc"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="84"
        font-weight="700"
        letter-spacing="-4">
    Hi there Traveler!
  </text>

  <!-- Divider -->
  <path d="M56 271h650"
        stroke="#30363d"
        stroke-width="1"/>

  <!-- Categories -->
  <text x="56" y="310"
        fill="#c9d1d9"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="17"
        letter-spacing="2.2">
    WEB
  </text>

  <circle cx="119" cy="304" r="2.5" fill="#58a6ff"/>

  <text x="140" y="310"
        fill="#c9d1d9"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="17"
        letter-spacing="2.2">
    MEDIA
  </text>

  <circle cx="225" cy="304" r="2.5" fill="#58a6ff"/>

  <text x="247" y="310"
        fill="#c9d1d9"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="17"
        letter-spacing="2.2">
    GAME DEV
  </text>

  <text x="706" y="310"
        fill="#8b949e"
        text-anchor="end"
        font-family="Segoe UI,Arial,sans-serif"
        font-size="15">
    INDONESIA
  </text>

  <!-- Workspace -->
  <g transform="translate(785 49)">

    <!-- Window -->
    <rect x="29" y="0"
          width="384"
          height="254"
          rx="12"
          fill="#161b22"
          stroke="#30363d"
          stroke-width="1.5"/>

    <path d="M29 35h384"
          stroke="#30363d"
          stroke-width="1.5"/>

    <!-- Window controls -->
    <circle cx="49" cy="18" r="3" fill="#58a6ff"/>
    <circle cx="62" cy="18" r="3" fill="#8b949e"/>
    <circle cx="75" cy="18" r="3" fill="#484f58"/>

    <!-- Grid container -->
    <rect x="50" y="56"
          width="219"
          height="125"
          rx="6"
          fill="#0d1117"/>

    <!-- Grid cards -->
    <g fill="#21262d">
      <rect x="60" y="66" width="37" height="29" rx="3"/>
      <rect x="102" y="66" width="37" height="29" rx="3"/>
      <rect x="144" y="66" width="37" height="29" rx="3"/>
      <rect x="186" y="66" width="37" height="29" rx="3"/>
      <rect x="228" y="66" width="31" height="29" rx="3"/>

      <rect x="60" y="100" width="37" height="29" rx="3"/>
      <rect x="102" y="100" width="37" height="29" rx="3"/>
      <rect x="144" y="100" width="37" height="29" rx="3"/>
      <rect x="186" y="100" width="37" height="29" rx="3"/>
      <rect x="228" y="100" width="31" height="29" rx="3"/>

      <rect x="60" y="134" width="37" height="37" rx="3"/>
      <rect x="102" y="134" width="37" height="37" rx="3"/>
      <rect x="144" y="134" width="37" height="37" rx="3"/>
      <rect x="186" y="134" width="37" height="37" rx="3"/>
      <rect x="228" y="134" width="31" height="37" rx="3"/>
    </g>

    <!-- Active tile -->
    <rect x="144" y="100"
          width="37"
          height="29"
          rx="3"
          fill="#58a6ff"/>

    <path d="M163 106v17m-8-8h16"
          stroke="#0d1117"
          stroke-width="2"
          stroke-linecap="round"/>

    <!-- Video panel -->
    <rect x="285" y="56"
          width="108"
          height="125"
          rx="6"
          fill="#21262d"
          stroke="#30363d"/>

    <circle cx="339" cy="107"
            r="28"
            fill="#30363d"/>

    <path d="m334 95 17 12-17 12z"
          fill="#58a6ff"/>

    <path d="M307 154h63"
          stroke="#484f58"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Text mockup -->
    <rect x="50" y="201"
          width="143"
          height="6"
          rx="3"
          fill="#8b949e"/>

    <rect x="50" y="216"
          width="97"
          height="5"
          rx="2.5"
          fill="#484f58"/>

    <!-- Progress bar -->
    <path d="M280 224h108"
          stroke="#30363d"
          stroke-width="4"
          stroke-linecap="round"/>

    <path d="M280 224h69"
          stroke="#58a6ff"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- Cursor -->
    <path d="m5 219 36 8-12 12 13 22-9 5-13-22-13 9z"
          fill="#f0f6fc"
          stroke="#0d1117"
          stroke-width="3"
          stroke-linejoin="round"/>
  </g>
</svg>
