    <rect x="882" y="121" width="52" height="6" rx="3" fill="#8493a8" opacity="0.85"/>
    <rect x="882" y="132" width="42" height="6" rx="3" fill="#8493a8" opacity="0.72"/>

    <text x="1088" y="138"
