    <!-- card labels -->
    <rect x="865" y="273" width="42" height="5" rx="2.5" fill="#7a899e" opacity="0.85"/>
    <rect x="969" y="273" width="42" height="5" rx="2.5" fill="#7a899e" opacity="0.85"/>
    <rect x="1073" y="273" width="42" height="5" rx="2.5" fill="#7a899e" opacity="0.85"/>

    <!-- cursor -->
