  </text>

  <!-- small scribble near title -->
  <path d="M430 216 C448 209, 470 211, 490 223" fill="none" stroke="#bac7d8" stroke-opacity="0.45" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M438 228 C458 220, 482 224, 501 238" fill="none" stroke="#bac7d8" stroke-opacity="0.28" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Subtitle -->
  <text x="55" y="278"
        fill="#90a0b4"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="28"
        font-weight="400"
        letter-spacing="3">
