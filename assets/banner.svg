<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Hello there traveler!</title>
  <desc id="desc">A dark GitHub profile banner with a more human-made creative workspace illustration.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="glowRight" cx="70%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#314158" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#314158" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="windowSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202938"/>
      <stop offset="100%" stop-color="#121923"/>
    </linearGradient>

    <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172131"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>

    <filter id="shadowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="shadowCard" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>

    <filter id="blurSmall">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="clipWindow">
      <rect x="790" y="42" width="425" height="260" rx="22"/>
    </clipPath>

    <clipPath id="clipHero">
      <rect x="865" y="86" width="285" height="102" rx="14"/>
    </clipPath>

    <clipPath id="clipThumb1">
      <rect x="865" y="206" width="92" height="60" rx="10"/>
    </clipPath>

    <clipPath id="clipThumb2">
      <rect x="969" y="206" width="92" height="60" rx="10"/>
    </clipPath>

    <clipPath id="clipThumb3">
      <rect x="1073" y="206" width="92" height="60" rx="10"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" rx="18" fill="url(#bgGrad)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glowRight)"/>

  <!-- subtle background texture-ish accents -->
  <path d="M485 64 C530 48, 575 52, 617 74" fill="none" stroke="#95a6bf" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M500 280 C545 255, 582 258, 628 286" fill="none" stroke="#95a6bf" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="507" cy="86" r="1.6" fill="#d4deed" opacity="0.18"/>
  <circle cx="522" cy="86" r="1.6" fill="#d4deed" opacity="0.12"/>
  <circle cx="537" cy="86" r="1.6" fill="#d4deed" opacity="0.15"/>

  <!-- Brand -->
  <rect x="54" y="42" width="12" height="12" rx="1.5" fill="#f3f6fb"/>
  <text x="80" y="54"
        fill="#d9e2ef"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="17"
        font-weight="500"
        letter-spacing="4">
    YAHYAKUN
  </text>

  <!-- Main title -->
  <text x="52" y="145"
        fill="#f3f6fb"
        font-family="Arial, Helvetica, sans-serif"
        font-size="62"
        font-weight="700"
        letter-spacing="-2">
    Hello there
  </text>

  <text x="52" y="230"
