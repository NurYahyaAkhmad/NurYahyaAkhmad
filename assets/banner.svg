    <rect x="1148" y="86" width="55" height="102" rx="12" fill="#1a2230" opacity="0.96"/>
    <circle cx="1170" cy="112" r="12" fill="#cdd6e5" opacity="0.9"/>
    <rect x="1187" y="104" width="42" height="6" rx="3" fill="#8493a8" opacity="0.95"/>
    <rect x="1187" y="118" width="32" height="6" rx="3" fill="#6d7b8d" opacity="0.8"/>

    <circle cx="1165" cy="152" r="4.8" fill="#e7edf7" opacity="0.95"/>
    <rect x="1178" y="148" width="46" height="6" rx="3" fill="#93a2b7" opacity="0.9"/>

    <circle cx="1165" cy="184" r="4.8" fill="#b8c4d6" opacity="0.82"/>
    <rect x="1178" y="180" width="54" height="6" rx="3" fill="#6d7b8d" opacity="0.82"/>

    <rect x="1148" y="206" width="55" height="60" rx="12" fill="#1a2230" opacity="0.96"/>
