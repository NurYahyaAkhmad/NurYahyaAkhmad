      <path d="M16 72 C25 68, 28 58, 22 50 C33 47, 38 37, 34 28" fill="none" stroke="#7a8797" stroke-width="1.2" stroke-opacity="0.55"/>
      <path d="M48 83 C55 78, 57 68, 54 60" fill="none" stroke="#7a8797" stroke-width="1.2" stroke-opacity="0.55"/>
      <path d="M42 16 A8 8 0 1 1 42 32 A8 8 0 1 1 42 16 Z" fill="none" stroke="#7a8797" stroke-width="1.1" stroke-opacity="0.45"/>
    </g>
  </g>

  <!-- Main window -->
  <g filter="url(#shadowSoft)">
    <rect x="790" y="42" width="425" height="260" rx="22" fill="url(#windowSheen)"/>
    <rect x="790" y="42" width="425" height="34" rx="22" fill="#1c2634" opacity="0.62"/>
    <rect x="790" y="56" width="425" height="246" rx="0" fill="#111825"/>

    <!-- window controls -->
<g opacity="0.95">

  <!-- Minimize -->
  <g transform="rotate(-5 1142.5 59)">
    <path
      d="M1137 59 H1148"
      fill="none"
      stroke="#dfe7f4"
      stroke-width="1.4"
      stroke-linecap="round"
    />
  </g>

  <!-- Maximize -->
  <g transform="rotate(3 1173 58.5)">
    <rect
      x="1167"
      y="52.5"
      width="12"
      height="12"
      rx="1"
      fill="none"
      stroke="#dfe7f4"
      stroke-width="1.2"
    />
  </g>

  <!-- Close -->
  <g transform="rotate(-4 1202.5 58)">
    <path
      d="M1197 52.5 L1208 63.5"
      fill="none"
      stroke="#f3f6fb"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <path
      d="M1208 52.5 L1197 63.5"
      fill="none"
      stroke="#f3f6fb"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </g>

</g>

    <!-- sidebar -->
