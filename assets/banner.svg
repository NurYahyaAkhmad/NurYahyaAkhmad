    <path d="M1158 232 L1164 226 L1169 229 L1176 220 L1176 234 H1158 Z" fill="#b8c6d9" opacity="0.85"/>
    <rect x="1183" y="218" width="36" height="5" rx="2.5" fill="#93a2b7" opacity="0.9"/>
