<svg xmlns="http://www.w3.org/2000/svg" width="640" height="105" viewBox="0 0 640 105" role="img" aria-labelledby="title desc">
  <title id="title">Visit my main portfolio</title>
  <desc id="desc">yahyakun.vercel.app</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="638" height="103" rx="16" fill="#0D1117"/>

  <!-- small label -->
  <text x="28" y="31"
        fill="#cfd6e4"
        font-family="Trebuchet MS, Arial, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="1.2">
    my main site
  </text>

  <!-- main text -->
  <text x="26" y="71"
        fill="#f2f4fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="700"
        letter-spacing="-0.4">
    yahyakun.vercel.app
  </text>

  <!-- imperfect underline -->
  <path d="M28 79 C95 85, 180 83, 286 80"
        fill="none"
        stroke="#8da2c2"
        stroke-width="2.6"
        stroke-linecap="round"
        opacity="0.55"/>

  <path d="M29 83 C92 88, 172 87, 247 85"
        fill="none"
        stroke="#8da2c2"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.26"/>

  <!-- arrow card, made slightly offset / rotated -->
  <g transform="rotate(2 584 52)" filter="url(#shadow)">
    <rect x="551" y="19" width="66" height="66" rx="15" fill="#161f2d"/>
    <path d="M573 61 L596 38"
          stroke="#f2f4fc"
          stroke-width="3"
          stroke-linecap="round"/>
    <path d="M579 38 H596 V55"
          fill="none"
          stroke="#f2f4fc"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
